# Build for Coolify on the own server (docs/DEPLOY.md, ADR-0047).
[variables]
NIXPACKS_NODE_VERSION = "22"

[phases.build]
cmds = ["pnpm build"]

# Migrations first, so new code never runs against an old schema. They keep
# the previous version working, which still serves until this one is healthy.
[start]
cmd = "pnpm db:migrate && pnpm start"

# curl for Coolify's health check (/healthz).
[phases.setup]
aptPkgs = ["...", "curl"]
