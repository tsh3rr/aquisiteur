name: Release

# Puts a released version live in production (ADR-0057). Staging gets every
# merge (image.yml); production only what you release: push a tag like
# v2026.10.20 or run this workflow on main (also from the GitHub app). Running
# it on an older tag rolls production back to that version. Without the
# PROD_DEPLOY_* secrets the image is still tagged and the deploy is skipped.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Releases queue up instead of cancelling each other.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  release:
    name: Release to production
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Same commit, same cache as image.yml, so this is quick and also covers
      # commits whose staging build was cancelled by a newer merge.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:production
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && format('{0}:{1}', env.IMAGE, github.ref_name) || '' }}
          cache-from: type=gha
      - uses: ./.github/actions/compose-deploy
        with:
          ssh-key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          host: ${{ secrets.PROD_DEPLOY_HOST }}
          port: ${{ secrets.PROD_DEPLOY_PORT }}
          user: ${{ secrets.PROD_DEPLOY_USER }}
          dir: ${{ secrets.PROD_DEPLOY_DIR }}
          known-hosts: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
