name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  APP_URL: http://localhost:3000
  PLATFORM_DOMAIN: localhost
  BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-ci
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, format, typecheck, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test

  database:
    name: Tenant isolation (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquisiteur
          POSTGRES_PASSWORD: aquisiteur
          POSTGRES_DB: aquisiteur_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aquisiteur -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://aquisiteur:aquisiteur@localhost:5432/aquisiteur_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db

  e2e:
    name: E2E + accessibility (Playwright, axe)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aquisiteur
          POSTGRES_PASSWORD: aquisiteur
          POSTGRES_DB: aquisiteur_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aquisiteur -d postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://aquisiteur:aquisiteur@localhost:5432/aquisiteur_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  cloudflare:
    name: Cloudflare bundle (OpenNext)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cf:build
