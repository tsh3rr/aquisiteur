name: Image

# Builds the app image on GitHub and pushes it to ghcr.io, so the server only
# pulls and starts it (ADR-0053). Pull requests that touch the image only build.
on:
  push:
    branches: [main]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/image.yml]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the app image
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name != 'pull_request' }}
      # Optional: Coolify's deploy webhook, so a new image goes live without a click.
      COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
      COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Deploy in Coolify
        if: env.PUSH == 'true' && env.COOLIFY_WEBHOOK != ''
        run: |
          curl -fsS -H "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"
