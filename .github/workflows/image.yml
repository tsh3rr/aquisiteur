name: Image

# Builds the app image on GitHub and pushes it to ghcr.io, so the server only
# pulls and starts it (ADR-0053). Pull requests that touch the image only build.
# With the DEPLOY_* secrets set, a pushed image also goes live on the staging
# Compose server over SSH (ADR-0054, ADR-0057); production only gets released
# versions (release.yml). The concurrency group cancels a running build when a
# newer commit lands, so merges in quick succession build and deploy once.
on:
  push:
    branches: [main]
    # Docs never reach the image (.dockerignore), so docs-only merges skip the build.
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/image.yml]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push the app image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMAGE: ghcr.io/${{ github.repository }}
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to staging
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/compose-deploy
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          host: ${{ secrets.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT }}
          user: ${{ secrets.DEPLOY_USER }}
          dir: ${{ secrets.DEPLOY_DIR }}
          known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
