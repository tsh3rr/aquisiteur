name: Deploy to a Compose server
description: >
  Logs into a Docker Compose server over SSH, pulls the app image and restarts
  the app (docs/DEPLOY.md). Does nothing when key or host is empty.

inputs:
  ssh-key:
    description: Private key whose public half is in the server's authorized_keys
    required: true
  host:
    description: Server name
    required: true
  port:
    description: SSH port
    default: "22"
  user:
    description: SSH user
    default: root
  dir:
    description: Directory with compose.yml on the server
    default: /opt/aquisiteur
  known-hosts:
    description: known_hosts line for the server; scanned on the fly when empty
    default: ""

runs:
  using: composite
  steps:
    - name: Skip without deploy secrets
      if: inputs.ssh-key == '' || inputs.host == ''
      shell: bash
      run: echo "No SSH key or host for this server, nothing to deploy."
    - name: Pull the new image and restart the app
      if: inputs.ssh-key != '' && inputs.host != ''
      shell: bash
      env:
        SSH_KEY: ${{ inputs.ssh-key }}
        HOST: ${{ inputs.host }}
        PORT: ${{ inputs.port || '22' }}
        SSH_USER: ${{ inputs.user || 'root' }}
        DIR: ${{ inputs.dir || '/opt/aquisiteur' }}
        KNOWN_HOSTS: ${{ inputs.known-hosts }}
      run: |
        install -d -m 700 ~/.ssh
        printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
        chmod 600 ~/.ssh/deploy_key
        if [ -n "$KNOWN_HOSTS" ]; then
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
        else
          ssh-keyscan -p "$PORT" "$HOST" > ~/.ssh/known_hosts
        fi
        # A key restricted with command="..." in authorized_keys runs its own
        # command instead; this one is the same, so both setups work.
        ssh -i ~/.ssh/deploy_key -p "$PORT" -o BatchMode=yes "$SSH_USER@$HOST" \
          "cd $DIR && docker compose pull -q app && docker compose up -d && docker image prune -f"
