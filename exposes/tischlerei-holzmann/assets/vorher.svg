  <text x="190" y="155" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#fff">Tischlerei Holzmann GmbH</text>
  <g font-family="Arial, sans-serif" font-size="18" fill="#2f5d3a"><text x="190" y="230">Home | Firma | Leistungen | Kontakt | Impressum</text></g>
  <g font-family="Arial, sans-serif" font-size="18" fill="#333">
    <text x="190" y="290">Die Tischlerei Holzmann GmbH ist ein Meisterbetrieb in Leipzig. Wir fertigen Möbel, Küchen, Treppen,</text>
    <text x="190" y="318">Fenster und Türen nach Maß. Unsere Leistungen umfassen die Planung, Fertigung und Montage. Wir arbeiten</text>
    <text x="190" y="346">mit Massivholz und Holzwerkstoffen. Auch Reparaturen und Restaurierungen führen wir durch. Gerne</text>
    <text x="190" y="374">erstellen wir Ihnen ein individuelles Angebot. Rufen Sie uns an oder schreiben Sie uns eine E-Mail.</text>
    <text x="190" y="402">Wir sind ein Ausbildungsbetrieb. Unser Team besteht aus 9 Mitarbeitern. Qualität seit 1994.</text>
  </g>
