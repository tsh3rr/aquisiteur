  <g font-family="Times New Roman, serif" font-size="19" fill="#333">
    <text x="570" y="310">Herzlich willkommen auf unserer Homepage! Wir freuen uns über Ihren Besuch.</text>
    <text x="570" y="338">Seit 1987 backen wir täglich frische Kuchen und Torten nach Omas Rezepten.</text>
    <text x="570" y="366">Besuchen Sie uns in der Gottschedstraße. Wir haben auch Frühstück und</text>
