# Aquisiteur on a small server without Coolify (docs/DEPLOY_COMPOSE.md, ADR-0054):
# Postgres plus the app image built on GitHub. Mikrus terminates HTTPS and
# forwards plain HTTP to port 80, so no reverse proxy is needed.
name: aquisiteur

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquisiteur
      POSTGRES_DB: aquisiteur
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "aquisiteur", "-d", "aquisiteur"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: ${APP_IMAGE:-ghcr.io/tsh3rr/aquisiteur:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://aquisiteur:${POSTGRES_PASSWORD}@db:5432/aquisiteur
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      LOCAL_STORAGE_DIR: /data/files
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:3000"
    volumes:
      - files:/data/files
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  db-data:
  files:
